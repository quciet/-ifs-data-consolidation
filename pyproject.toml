[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ifs-data-repository"
version = "0.1.0"
description = "Local, recipe-driven IFs data intake, consolidation, and validation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ifs-data = "ifs_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
